# Valores para instalar el stack de monitoreo con Helm:
#
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Descubre automáticamente los ServiceMonitor con este label,
    # incluido el de nuestra app (ver service-monitor.yaml)
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  adminPassword: "" # inyectar vía --set o secret externo, nunca en texto plano
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "demo-app"
          orgId: 1
          folder: "Demo App"
          type: file
          options:
            path: /var/lib/grafana/dashboards/demo-app
  dashboardsConfigMaps:
    demo-app: "grafana-dashboard-demo-app"

alertmanager:
  enabled: true
  config:
    route:
      receiver: "null"
    receivers:
      - name: "null"
